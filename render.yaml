services:
  - type: web
    name: claude-video-render
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /up
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: DB_CONNECTION
        value: pgsql
      # Points at a dedicated Supabase Postgres project (not Render's own
      # managed Postgres, and not the nhs-portal-1 Supabase project) —
      # set these directly in the Render dashboard, never committed here.
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_DATABASE
        value: postgres
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: SESSION_DRIVER
        value: file
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: LOG_CHANNEL
        value: stderr
      - key: LOVABLE_NHS_PORTAL_1_URL
        sync: false
      - key: LOVABLE_NHS_PORTAL_1_KEY
        sync: false

services:
  - type: web
    name: claude-video-render
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    # No healthCheckPath: Render's HTTP health check needs the app to
    # actually respond, which a CPU-starved container can't do during a
    # render (confirmed — ultrafast/640p/single-thread still timed out).
    # The default TCP-level check (is the port open) doesn't depend on
    # the app getting scheduled at all, since the OS accepts the
    # connection into its backlog regardless of CPU availability.
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: DB_CONNECTION
        value: pgsql
      # Points at a dedicated Supabase Postgres project (not Render's own
      # managed Postgres, and not the nhs-portal-1 Supabase project) —
      # set these directly in the Render dashboard, never committed here.
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_DATABASE
        value: postgres
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: SESSION_DRIVER
        value: file
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: database
      # RendererManager's own default (when these are unset) is now
      # "keep source quality" — safe for Oracle/local with real CPU, but
      # would reproduce the OOM/health-check-timeout crashes we hit on
      # Render's free tier. Set explicitly here instead of relying on a
      # Render-specific code default.
      - key: RENDER_MAX_OUTPUT_WIDTH
        value: "640"
      - key: RENDER_X264_PRESET
        value: ultrafast
      - key: RENDER_X264_PARAMS
        value: "rc-lookahead=0:ref=1"
      - key: RENDER_FFMPEG_THREADS
        value: "1"
      - key: LOG_CHANNEL
        value: stderr
      - key: LOVABLE_NHS_PORTAL_1_URL
        sync: false
      - key: LOVABLE_NHS_PORTAL_1_KEY
        sync: false
